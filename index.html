<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO -->
    <meta
      name="description"
      content="Concretely — visualiseurs interactifs qui rendent concrets des concepts de programmation abstraits : algorithmes de tri, recherche de chemin, Big-O, récursion, event loop, structures de données, valeur vs référence, Swift/Combine. Bilingue FR/EN."
    />
    <meta
      name="keywords"
      content="visualisation algorithmes, tri, pathfinding, big-o, récursion, event loop, structures de données, vue 3, pédagogie, développeur"
    />
    <meta name="author" content="Alex Rovere" />

    <!-- Open Graph -->
    <meta property="og:title" content="Concretely — rendre le code abstrait concret" />
    <meta
      property="og:description"
      content="Visualiseurs interactifs pour comprendre algorithmes, structures de données et concepts d'exécution. Bilingue FR/EN."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="theme-color" content="#0f172a" />

    <title>Concretely — rendre le code abstrait concret</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Anti-FOUC : pose le thème avant le premier paint (même clé que useTheme). -->
    <script>
      try {
        var t = new URLSearchParams(location.search).get('theme');
        if (t !== 'dark' && t !== 'light') t = localStorage.getItem('concretely:theme');
        if (t !== 'dark' && t !== 'light')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
